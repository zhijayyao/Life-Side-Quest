<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Side Quest · 人生隐藏任务</title>
    <style>
        :root {
            --misty-lavender: #E8E0F0;
            --soft-rose: #F5E6E8;
            --moonlight-blue: #E0E8F0;
            --warm-gold: #F5E8D8;
            --dream-white: #FAFAFA;
            --deep-twilight: #2A2A3E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Georgia, 'Times New Roman', serif;
            background: var(--deep-twilight);
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--misty-lavender) 0%, var(--soft-rose) 50%, var(--moonlight-blue) 100%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-text {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: var(--deep-twilight);
            opacity: 0;
            letter-spacing: 0.3em;
            margin-bottom: 1rem;
        }

        .loading-bar {
            width: 200px;
            height: 2px;
            background: rgba(42, 42, 62, 0.1);
            border-radius: 1px;
            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: var(--deep-twilight);
            transition: width 0.3s ease;
        }

        .task-card {
            position: relative;
            max-width: 520px;
            width: calc(100% - 48px);
            padding: 48px;
            background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(42, 42, 62, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            pointer-events: auto;
            opacity: 0;
            transform: translateY(60px);
            animation: cardFloat 10s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .card-header { text-align: center; margin-bottom: 32px; }

        .card-title {
            font-family: monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(42, 42, 62, 0.6);
            margin-bottom: 16px;
        }

        .rarity-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .rarity-badge.s-rank {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 215, 0, 0.3);
        }

        .rarity-badge.a-rank {
            background: linear-gradient(135deg, #C0C0C0 0%, #A8A8A8 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(192, 192, 192, 0.3);
        }

        .rarity-badge.b-rank {
            background: linear-gradient(135deg, #CD7F32 0%, #B87333 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(205, 127, 50, 0.3);
        }

        .rarity-badge.c-rank {
            background: rgba(255, 255, 255, 0.3);
            color: var(--deep-twilight);
        }

        .task-category {
            font-family: monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(42, 42, 62, 0.6);
            margin-top: 8px;
        }

        .task-content { text-align: center; margin-bottom: 32px; }

        .task-image-container {
            width: 100%;
            height: 200px;
            margin-bottom: 24px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 100%);
            box-shadow: 0 4px 16px rgba(42, 42, 62, 0.1);
        }

        .task-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.5s ease;
            transform: scale(1.05);
        }

        .task-image.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .task-image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 0%, transparent 50%, rgba(42, 42, 62, 0.2) 100%);
            pointer-events: none;
        }

        .task-description {
            font-size: clamp(1.5rem, 4vw, 2rem);
            line-height: 1.6;
            color: rgba(42, 42, 62, 0.9);
            margin-bottom: 16px;
        }

        .task-hint {
            font-size: 0.9rem;
            color: rgba(42, 42, 62, 0.6);
        }

        .task-reward {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
        }

        .reward-label {
            font-family: monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(42, 42, 62, 0.6);
        }

        .reward-text {
            font-size: 1rem;
            color: rgba(42, 42, 62, 0.9);
            font-style: italic;
        }

        .card-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 32px;
        }

        .glass-button {
            position: relative;
            padding: 16px 32px;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.2) 100%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            color: var(--deep-twilight);
            font-size: 0.9rem;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .glass-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(42, 42, 62, 0.15);
        }

        .glass-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .glass-button.primary {
            background: linear-gradient(135deg, rgba(42, 42, 62, 0.9) 0%, rgba(42, 42, 62, 0.7) 100%);
            color: var(--dream-white);
        }

        .date-display {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            color: rgba(42, 42, 62, 0.4);
            z-index: 20;
            opacity: 0;
        }

        .particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }

        .achievement-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 100%);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 48px;
            text-align: center;
            z-index: 50;
            opacity: 0;
        }

        .achievement-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--warm-gold) 0%, var(--soft-rose) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .achievement-title {
            font-size: 1.5rem;
            color: var(--deep-twilight);
            margin-bottom: 8px;
        }

        .achievement-desc {
            font-size: 0.9rem;
            color: rgba(42, 42, 62, 0.6);
        }

        @media (max-width: 768px) {
            .task-card { padding: 32px 24px; }
            .card-actions { flex-direction: column; }
            .glass-button { width: 100%; }
        }

        @media (max-width: 480px) {
            .task-card { padding: 24px 20px; border-radius: 24px; }
            .task-description { font-size: 1.3rem; }
        }
    </style>
</head>

        class BackgroundRenderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.time = 0;
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            lerp(a, b, t) { return a + (b - a) * t; }

            draw() {
                this.time += 0.0001;
                const { width, height } = this.canvas;
                const imageData = this.ctx.createImageData(width, height);
                const data = imageData.data;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const i = (y * width + x) * 4;
                        const nx = x / width;
                        const ny = y / height;
                        
                        const angle1 = Math.sin(nx * 2 + this.time) * Math.cos(ny * 3 + this.time * 0.5);
                        const angle2 = Math.cos(nx * 3 - this.time * 0.7) * Math.sin(ny * 2 + this.time * 0.3);
                        const angle3 = Math.sin((nx + ny) * 2 + this.time * 0.8);
                        const combined = (angle1 + angle2 + angle3) / 3;
                        
                        const colors = [
                            { r: 232, g: 224, b: 240 },
                            { r: 245, g: 230, b: 232 },
                            { r: 224, g: 232, b: 240 },
                            { r: 245, g: 232, b: 216 },
                            { r: 220, g: 240, b: 230 },
                            { r: 248, g: 235, b: 245 },
                            { r: 230, g: 220, b: 245 },
                            { r: 250, g: 240, b: 225 },
                            { r: 240, g: 225, b: 235 },
                            { r: 225, g: 235, b: 250 },
                            { r: 245, g: 228, b: 228 },
                            { r: 238, g: 245, b: 230 }
                        ];
                        
                        const colorIndex1 = Math.floor((Math.sin(this.time * 0.5 + nx * 2) + 1) / 2 * (colors.length - 1));
                        const colorIndex2 = (colorIndex1 + 1) % colors.length;
                        const blend = (Math.sin(this.time * 0.5 + nx * 2) + 1) / 2 * (colors.length - 1) - colorIndex1;
                        
                        const c1 = colors[colorIndex1];
                        const c2 = colors[colorIndex2];
                        
                        const r = Math.floor(this.lerp(c1.r, c2.r, blend) + combined * 15);
                        const g = Math.floor(this.lerp(c1.g, c2.g, blend) + combined * 15);
                        const b = Math.floor(this.lerp(c1.b, c2.b, blend) + combined * 15);
                        
                        data[i] = Math.min(255, Math.max(200, r));
                        data[i + 1] = Math.min(255, Math.max(200, g));
                        data[i + 2] = Math.min(255, Math.max(200, b));
                        data[i + 3] = 255;
                    }
                }
                this.ctx.putImageData(imageData, 0, 0);
            }

            animate() {
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            burst(x, y, count = 30) {
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 / count) * i;
                    const speed = 2 + Math.random() * 3;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 2,
                        life: 1,
                        decay: 0.008 + Math.random() * 0.005,
                        size: 3 + Math.random() * 5,
                        hue: Math.random() * 360
                    });
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.02;
                    p.life -= p.decay;
                    
                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }
                    
                    this.ctx.save();
                    this.ctx.globalAlpha = p.life;
                    const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2);
                    gradient.addColorStop(0, `hsla(${p.hue}, 80%, 80%, 1)`);
                    gradient.addColorStop(1, `hsla(${p.hue}, 80%, 60%, 0)`);
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }
                requestAnimationFrame(() => this.animate());
            }
        }

        class App {
            constructor() {
                this.currentQuest = null;
                this.completedQuests = JSON.parse(localStorage.getItem('completedQuests') || '[]');
                
                this.loadingScreen = document.getElementById('loadingScreen');
                this.loadingText = document.getElementById('loadingText');
                this.loadingProgress = document.getElementById('loadingProgress');
                this.taskCard = document.getElementById('taskCard');
                this.taskImage = document.getElementById('taskImage');
                this.taskImageContainer = document.getElementById('taskImageContainer');
                this.rarityBadge = document.getElementById('rarityBadge');
                this.rarityText = document.getElementById('rarityText');
                this.taskCategory = document.getElementById('taskCategory');
                this.taskDescription = document.getElementById('taskDescription');
                this.taskHint = document.getElementById('taskHint');
                this.taskReward = document.getElementById('taskReward');
                this.refreshBtn = document.getElementById('refreshBtn');
                this.acceptBtn = document.getElementById('acceptBtn');
                this.dateDisplay = document.getElementById('dateDisplay');
                this.achievementPopup = document.getElementById('achievementPopup');
                this.achievementDesc = document.getElementById('achievementDesc');

                this.initBackground();
                this.initParticles();
                this.initEventListeners();
                this.initDateDisplay();
                this.startIntro();
            }

            initBackground() {
                const canvas = document.getElementById('bg-canvas');
                this.bg = new BackgroundRenderer(canvas);
                this.bg.animate();
            }

            initParticles() {
                const canvas = document.getElementById('particleCanvas');
                this.particles = new ParticleSystem(canvas);
                this.particles.animate();
            }

            initEventListeners() {
                this.refreshBtn.addEventListener('click', () => this.refreshQuest());
                this.acceptBtn.addEventListener('click', () => this.completeQuest());
            }

            initDateDisplay() {
                const now = new Date();
                this.dateDisplay.textContent = now.toLocaleDateString('zh-CN', {
                    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
                });
            }

            startIntro() {
                let progress = 0;
                const loadingInterval = setInterval(() => {
                    progress += 5;
                    this.loadingProgress.style.width = `${progress}%`;
                    
                    if (progress >= 100) {
                        clearInterval(loadingInterval);
                        this.loadingText.style.opacity = '1';
                        setTimeout(() => {
                            this.loadingScreen.style.opacity = '0';
                            setTimeout(() => {
                                this.loadingScreen.style.display = 'none';
                                this.loadNewQuest();
                                this.showUI();
                            }, 1000);
                        }, 500);
                    }
                }, 50);
            }

            loadNewQuest() {
                const available = QUESTS.filter(q => !this.completedQuests.includes(q.id));
                this.currentQuest = available.length ? available[Math.floor(Math.random() * available.length)] : QUESTS[Math.floor(Math.random() * QUESTS.length)];
                this.updateQuestDisplay();
            }

            updateQuestDisplay() {
                if (!this.currentQuest) return;
                
                this.rarityBadge.className = `rarity-badge ${this.currentQuest.rarity.toLowerCase()}-rank`;
                this.rarityText.textContent = `${this.currentQuest.rarity}-RANK`;
                this.taskCategory.textContent = this.currentQuest.category;
                this.taskDescription.textContent = this.currentQuest.text;
                this.taskHint.textContent = this.currentQuest.hint;
                this.taskReward.textContent = this.currentQuest.reward;
                
                if (this.currentQuest.image) {
                    this.taskImage.classList.remove('loaded');
                    this.taskImage.src = this.currentQuest.image;
                    this.taskImage.onload = () => {
                        this.taskImage.classList.add('loaded');
                    };
                    this.taskImageContainer.style.display = 'block';
                } else {
                    this.taskImageContainer.style.display = 'none';
                }
            }

            showUI() {
                const els = [this.taskCard, this.dateDisplay];
                els.forEach((el, i) => {
                    setTimeout(() => {
                        el.style.opacity = '1';
                        el.style.transform = 'translateY(0)';
                    }, i * 200);
                });
                
                const cardEls = this.taskCard.querySelectorAll('.card-title, .rarity-badge, .task-category, .task-description, .task-hint, .task-reward, .glass-button');
                cardEls.forEach((el, i) => {
                    setTimeout(() => {
                        el.style.opacity = '1';
                        el.style.transform = 'translateY(0)';
                    }, 600 + i * 100);
                });
            }

            refreshQuest() {
                this.taskCard.style.opacity = '0';
                setTimeout(() => {
                    this.loadNewQuest();
                    this.taskCard.style.opacity = '1';
                }, 300);
            }

            completeQuest() {
                if (!this.currentQuest) return;
                
                this.completedQuests.push(this.currentQuest.id);
                localStorage.setItem('completedQuests', JSON.stringify(this.completedQuests));
                
                const rect = this.taskCard.getBoundingClientRect();
                this.particles.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 50);
                
                this.achievementDesc.textContent = this.currentQuest.reward;
                this.achievementPopup.style.transition = 'all 0.5s ease';
                this.achievementPopup.style.opacity = '1';
                this.achievementPopup.style.transform = 'translate(-50%, -50%) scale(1)';
                
                setTimeout(() => {
                    this.achievementPopup.style.opacity = '0';
                    this.achievementPopup.style.transform = 'translate(-50%, -50%) scale(0)';
                }, 2000);
                
                setTimeout(() => this.refreshQuest(), 2500);
            }
        }

        document.addEventListener('DOMContentLoaded', () => new App());
    </script>
